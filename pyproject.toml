[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hone"
version = "0.1.0"
description = "Minimal hone language with addition-only interpreter"
authors = [
  { name = "hone developer" }
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["hone", "language", "interpreter", "addition"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
hone = "hone.cli:main"
